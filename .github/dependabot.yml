version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/hub-ride-frontend'
      schedule:
          interval: 'daily'
      groups:
          patch-updates:
              patterns:
                  - '*'
              update-types:
                  - 'patch'
          minor-updates:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
      pull-request-branch-name:
          separator: '-'
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']